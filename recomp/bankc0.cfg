# Bank C0 jump-table bounds (indirect_dispatch): the analysis otherwise reads past the real entries.
bank = C0
# Event comparison operators: JSR ($6467,X) / JSR ($6477,X) with X = op * 2, ops 0-7
# (C0:6487..64C7 8-bit, C0:64CF..652F 16-bit); the bytes after the 8 entries are code.
indirect_dispatch 6307 8 idx:X tables:6467
indirect_dispatch 6398 8 idx:X tables:6467
indirect_dispatch 6433 8 idx:X tables:6467
indirect_dispatch 633D 8 idx:X tables:6477
indirect_dispatch 63D7 8 idx:X tables:6477

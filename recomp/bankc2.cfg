# Bank C2 jump-table bounds (indirect_dispatch): the analysis otherwise reads past the real entries.
# C2:EFBE menu sub-dispatch: PER $EFD2; JMP ($008A) with $8A = word C2:EFD4[A].
# The table has 16 words (13 distinct targets, entries 13-15 = EFD3, the RTS);
# the bytes from C2:EFF4 on are the first handler's code.
bank = C2
indirect_dispatch EFD0 13 ptrcall targets:EFD3,EFF4,F005,F011,F022,F036,F0A2,F071,F08D,F0B8,F068,F0C1,F0D1

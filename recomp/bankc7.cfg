# Bank C7 jump-table bounds (indirect_dispatch): the analysis otherwise reads past the real entries.
bank = C7
# C7:0004 (C7:0140) sound commands 10-17: JMP ($0AD9,X) with X = (cmd & 0F) * 2.
indirect_dispatch 0173 8 idx:X tables:0AD9
# C7:0004 runs interpreted (ct_hle_c70004 in src/decomp/sound.c); see there.
hle_func 0004 ct_hle_c70004
